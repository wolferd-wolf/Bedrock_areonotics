name: Build Android ARM64 Module

on:
  push:
    branches:
      - main
      - development
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: Build configuration
        required: true
        default: Debug
        type: choice
        options:
          - Debug
          - Release

permissions:
  contents: read

concurrency:
  group: android-arm64-${{ github.ref }}
  cancel-in-progress: true

env:
  MOD_BASE_VERSION: "0.0.24"
  MINECRAFT_VERSION: "1.26.33.1"
  NDK_VERSION: "28.2.13676358"
  CMAKE_VERSION: "3.22.1"
  PRELOADER_VERSION: "0.2.3"
  ANDROID_ABI: arm64-v8a
  ANDROID_PLATFORM: android-28
  BUILD_TYPE: ${{ inputs.build_type || 'Debug' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install pinned NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"

      - name: Set build version
        shell: bash
        run: echo "MOD_VERSION=${MOD_BASE_VERSION}-dev+${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Configure Android ARM64
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/android-arm64
          CMAKE_BIN="${ANDROID_SDK_ROOT}/cmake/${CMAKE_VERSION}/bin/cmake"
          NINJA_BIN="${ANDROID_SDK_ROOT}/cmake/${CMAKE_VERSION}/bin/ninja"
          TOOLCHAIN="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}/build/cmake/android.toolchain.cmake"
          LINKER_MAP="${GITHUB_WORKSPACE}/build/android-arm64/libbedrock_aeronautics.map"

          "$CMAKE_BIN" \
            -S . \
            -B build/android-arm64 \
            -G Ninja \
            -DCMAKE_MAKE_PROGRAM="$NINJA_BIN" \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI="$ANDROID_ABI" \
            -DANDROID_PLATFORM="$ANDROID_PLATFORM" \
            -DANDROID_STL=c++_shared \
            -DBEDROCK_AERONAUTICS_BUILD_TESTS=OFF \
            -DBEDROCK_AERONAUTICS_VERSION="$MOD_VERSION" \
            -DBEDROCK_AERONAUTICS_MINECRAFT_VERSIONS="[\"${MINECRAFT_VERSION}\"]" \
            -DBEDROCK_AERONAUTICS_LINKER_MAP="$LINKER_MAP" \
            2>&1 | tee build/android-arm64/configure.log

      - name: Compile module
        shell: bash
        run: |
          set -o pipefail
          "${ANDROID_SDK_ROOT}/cmake/${CMAKE_VERSION}/bin/cmake" \
            --build build/android-arm64 \
            --target bedrock_aeronautics \
            --parallel 2 \
            2>&1 | tee build/android-arm64/compile.log

      - name: Verify ELF and terrain command payload markers
        shell: bash
        run: |
          set -euo pipefail
          MODULE="build/android-arm64/libbedrock_aeronautics.so"
          LLVM_ROOT="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -f "$MODULE"
          test -f build/android-arm64/manifest.json
          file "$MODULE"
          "$LLVM_ROOT/llvm-readelf" -h "$MODULE" | tee build/android-arm64/elf-header.txt
          grep -Eq 'Machine:[[:space:]]+AArch64' build/android-arm64/elf-header.txt
          "$LLVM_ROOT/llvm-nm" -D --defined-only "$MODULE" | tee build/android-arm64/exports.txt
          grep -Eq '[[:space:]]PLGetModRegistration$' build/android-arm64/exports.txt
          grep -Eq '[[:space:]]bedrock_aeronautics_version$' build/android-arm64/exports.txt
          "$LLVM_ROOT/llvm-readelf" -d "$MODULE" | tee build/android-arm64/dynamic-section.txt
          grep -F 'libpreloader.so' build/android-arm64/dynamic-section.txt
          grep -F 'liblog.so' build/android-arm64/dynamic-section.txt
          if grep -F 'libGLESv3.so' build/android-arm64/dynamic-section.txt; then
            echo 'Discovery build must not depend on the retired EGL overlay path' >&2
            exit 1
          fi

          "$LLVM_ROOT/llvm-strings" "$MODULE" | tee build/android-arm64/runtime-markers.txt
          grep -F 'Read-only heartbeat hook installed' build/android-arm64/runtime-markers.txt
          grep -F 'ClientLevel tick event source installed' build/android-arm64/runtime-markers.txt
          grep -F 'Physics scheduler started' build/android-arm64/runtime-markers.txt
          grep -F 'persistent_grounded_sleep' build/android-arm64/runtime-markers.txt
          grep -F 'render_snapshot=seqlock_interpolation_pair' build/android-arm64/runtime-markers.txt
          grep -F 'source=terrain_command_payload_decoding' build/android-arm64/runtime-markers.txt
          grep -F 'read_only=true' build/android-arm64/runtime-markers.txt
          grep -F 'visible_geometry_expected=false' build/android-arm64/runtime-markers.txt
          grep -F 'geometry_submission=none_discovery_only' build/android-arm64/runtime-markers.txt
          grep -F 'minecraft_owned_submission=not_attempted' build/android-arm64/runtime-markers.txt
          grep -F 'framebuilderInsertTerrainCommandsForChunks_task_operator+0xbdb87b8' build/android-arm64/runtime-markers.txt
          grep -F 'terrain_command_construction_helper+0x1266ee9c' build/android-arm64/runtime-markers.txt
          grep -F 'helper_signature=8_integer_pointer_arguments_plus_float_s0' build/android-arm64/runtime-markers.txt
          grep -F 'helper_scope=thread_local_outer_terrain_task_gate' build/android-arm64/runtime-markers.txt
          grep -F 'descriptor_census=fixed_atomic_slots_no_heap_no_locks' build/android-arm64/runtime-markers.txt
          grep -F 'payload_decode=post_call_vector_bounded_64_byte_qwords' build/android-arm64/runtime-markers.txt
          grep -F 'payload_size_bytes=64' build/android-arm64/runtime-markers.txt
          grep -F 'payload_storage=fixed_atomic_descriptor_slots_no_heap_no_locks' build/android-arm64/runtime-markers.txt
          grep -F 'payload_before_capture=gated_destination_inside_pre_call_vector_size' build/android-arm64/runtime-markers.txt
          grep -F 'payload_after_capture=gated_destination_or_new_last_element_inside_post_call_vector_size' build/android-arm64/runtime-markers.txt
          grep -F 'container_interpretation=closure_0x30_begin_0x38_end_0x40_capacity' build/android-arm64/runtime-markers.txt
          grep -F 'container_element_type=64_byte_terrain_command_payload_unknown_layout' build/android-arm64/runtime-markers.txt
          grep -F 'closure_flag_interpretation=bitmask_bits_0_1_2_gate_optional_command_groups' build/android-arm64/runtime-markers.txt
          grep -F 'terrain-command-payload-status.txt' build/android-arm64/runtime-markers.txt
          grep -F 'terrain-command-payload-timeline.csv' build/android-arm64/runtime-markers.txt
          grep -F "$MINECRAFT_VERSION" build/android-arm64/runtime-markers.txt

          if grep -F 'geometry_submission=egl_opengles_camera_derived_world_anchor' build/android-arm64/runtime-markers.txt; then
            echo 'Retired EGL world-space approximation is still linked' >&2
            exit 1
          fi
          if grep -F 'context_fields_then_getters_then_view_then_bounded_scan' build/android-arm64/runtime-markers.txt; then
            echo 'Rejected camera memory scanner is still linked' >&2
            exit 1
          fi
          if grep -F 'camera_matrix_count=3' build/android-arm64/runtime-markers.txt; then
            echo 'Rejected three-matrix interpretation is still linked' >&2
            exit 1
          fi
          if grep -F 'TerrainClosureSnapshot' build/android-arm64/runtime-markers.txt; then
            echo 'Unsafe multi-producer snapshot ring must not be linked' >&2
            exit 1
          fi

          python3 -m json.tool build/android-arm64/manifest.json >/dev/null
          grep -F "\"${MINECRAFT_VERSION}\"" build/android-arm64/manifest.json

      - name: Package LeviLauncher mod and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          MODULE="build/android-arm64/libbedrock_aeronautics.so"
          LLVM_STRIP="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          CMAKE_BIN="${ANDROID_SDK_ROOT}/cmake/${CMAKE_VERSION}/bin/cmake"
          PACKAGE_DIR="artifact/package/bedrock_aeronautics"
          ANDROID_API="${ANDROID_PLATFORM#android-}"

          mkdir -p "$PACKAGE_DIR"
          cp "$MODULE" artifact/libbedrock_aeronautics_debug.so
          cp "$MODULE" artifact/libbedrock_aeronautics.so
          "$LLVM_STRIP" --strip-unneeded artifact/libbedrock_aeronautics.so
          cp artifact/libbedrock_aeronautics.so "$PACKAGE_DIR/libbedrock_aeronautics.so"
          cp build/android-arm64/manifest.json "$PACKAGE_DIR/manifest.json"

          "$CMAKE_BIN" -E chdir artifact/package \
            "$CMAKE_BIN" -E tar cf ../bedrock_aeronautics.levipack \
            --format=zip bedrock_aeronautics

          cp build/android-arm64/libbedrock_aeronautics.map artifact/
          cp build/android-arm64/elf-header.txt artifact/
          cp build/android-arm64/exports.txt artifact/
          cp build/android-arm64/dynamic-section.txt artifact/
          cp build/android-arm64/runtime-markers.txt artifact/
          cp build/android-arm64/configure.log artifact/
          cp build/android-arm64/compile.log artifact/
          cp README.md artifact/

          python3 tools/generate_build_manifest.py \
            --output artifact/build-manifest.json \
            --mod-version "$MOD_VERSION" \
            --git-commit "$GITHUB_SHA" \
            --minecraft-version "$MINECRAFT_VERSION" \
            --build-type "$BUILD_TYPE" \
            --ndk-version "$NDK_VERSION" \
            --cmake-version "$CMAKE_VERSION" \
            --android-api "$ANDROID_API" \
            --preloader-version "$PRELOADER_VERSION" \
            --run-id "$GITHUB_RUN_ID"

          (cd artifact && find . -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt)

      - name: Upload ARM64 module
        uses: actions/upload-artifact@v4
        with:
          name: bedrock-aeronautics-m2q-terrain-command-payload-mc-${{ env.MINECRAFT_VERSION }}-${{ github.sha }}
          path: artifact/
          retention-days: 14
          if-no-files-found: error
          compression-level: 6

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bedrock-aeronautics-build-failure-${{ github.sha }}
          path: |
            build/android-arm64/configure.log
            build/android-arm64/compile.log
            build/android-arm64/CMakeCache.txt
            build/android-arm64/CMakeFiles/CMakeError.log
            build/android-arm64/CMakeFiles/CMakeOutput.log
          retention-days: 7
          if-no-files-found: warn
